name: Update Checker

env:
  COMPETITIVE_REPO_URL: https://github.com/fantasylidong/CompetitiveWithAnne
  COMPETITIVE_REPO_BRANCH: master
  ANNE_REPO_URL: https://github.com/fantasylidong/anne
  ANNE_REPO_BRANCH: zonemod

on:
  schedule:
    - cron: 45 20 * * *
  workflow_dispatch:

jobs:
  jell:
    runs-on: ubuntu-latest

    steps:

    - name: 获取提交哈希值
      id: getHash
      run: |
        git clone --depth 1 "$COMPETITIVE_REPO_URL" -b "$COMPETITIVE_REPO_BRANCH" "$RUNNER_TEMP/competitive"
        git clone --depth 1 "$ANNE_REPO_URL" -b "$ANNE_REPO_BRANCH" "$RUNNER_TEMP/anne"
        echo "competitive_ref=$(git -C "$RUNNER_TEMP/competitive" rev-parse HEAD)" >> "$GITHUB_OUTPUT"
        echo "anne_ref=$(git -C "$RUNNER_TEMP/anne" rev-parse HEAD)" >> "$GITHUB_OUTPUT"

    - name: 比较提交哈希值
      id: cacheHash
      uses: actions/cache@v4
      with:
        path: .commitHash
        key: HEAD-${{ steps.getHash.outputs.competitive_ref }}-${{ steps.getHash.outputs.anne_ref }}

    - name: 保存新的哈希值
      if: steps.cacheHash.outputs.cache-hit != 'true'
      run: |
        printf '%s\n%s\n' \
          "${{ steps.getHash.outputs.competitive_ref }}" \
          "${{ steps.getHash.outputs.anne_ref }}" > .commitHash

    - name: 触发编译
      if: steps.cacheHash.outputs.cache-hit != 'true'
      uses: peter-evans/repository-dispatch@v1
      with:
        token: ${{ secrets.REPO_TOKEN }}
        event-type: plugin-update
        client-payload: >-
          {"competitive_ref":"${{ steps.getHash.outputs.competitive_ref }}","anne_ref":"${{ steps.getHash.outputs.anne_ref }}"}
    
    - name: 删除工作流
      uses: GitRML/delete-workflow-runs@main
      with:
        retain_days: 1
 
